<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathuravasi Pavbhaji Centre – Nagpur</title>
<style>
:root{color-scheme:light dark;--bg:#fbf6ee;--bg2:#f3e9d8;--tx:#2b1b17;--mut:#6d5a52;--card:#fff;--bd:#e6d9c4;--c1:#7a1226;--c2:#c9972b;--c3:#2f6b3f;--c4:#5a0f1e;--c5:#2f6b3f;--sh:0 14px 30px -16px rgba(60,20,10,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#1a1210;--bg2:#241915;--tx:#f7efe3;--mut:#c6b5a5;--card:#2a1d19;--bd:#44332b;--c1:#e0556a;--c2:#e2b04a}}
html{scroll-behavior:smooth;scroll-padding-top:70px}*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI','Noto Sans Devanagari',system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 4vw;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--bd)}
.logo{font-weight:800;font-size:1.05rem;background:linear-gradient(90deg,var(--c2),var(--c1),var(--c4));-webkit-background-clip:text;background-clip:text;color:transparent;flex:1}
nav{display:flex;gap:14px;font-size:.92rem}nav a{opacity:.85}nav a:hover{opacity:1;color:var(--c2)}
@media(max-width:700px){nav{display:none}}
.lang{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:99px;cursor:pointer;font-weight:700}
.wrap{max-width:1150px;margin:auto;padding:0 5vw}
section{padding:60px 0}
h2{font-size:clamp(1.6rem,4vw,2.4rem);margin:0 0 6px;background:linear-gradient(90deg,var(--c2),var(--c1));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:0 0 28px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;min-height:80vh}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
.badge{display:inline-block;padding:6px 14px;border-radius:99px;background:linear-gradient(90deg,var(--c4),var(--c1));font-weight:700;font-size:.85rem}
h1{font-size:clamp(2rem,6vw,3.7rem);line-height:1.1;margin:14px 0}
h1 span{background:linear-gradient(90deg,var(--c2),var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{display:inline-block;padding:12px 22px;border-radius:14px;font-weight:700;margin:6px 8px 6px 0;border:0;cursor:pointer;color:#fff;font-size:1rem;background:linear-gradient(135deg,var(--c1),var(--c4));box-shadow:0 10px 25px -8px var(--c1);transition:transform .2s}
.btn:hover{transform:translateY(-3px)}.btn.alt{background:linear-gradient(135deg,var(--c3),var(--c4));box-shadow:0 10px 25px -8px var(--c3)}.btn.gold{background:linear-gradient(135deg,var(--c2),var(--c1))}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:22px}.stat{padding:12px 18px;border-radius:16px;background:var(--card);border:1px solid var(--bd);text-align:center}.stat b{display:block;font-size:1.5rem;color:var(--c2)}
.scene{perspective:1100px}.tilt{transform-style:preserve-3d;transition:transform .15s;will-change:transform}
.photo{border-radius:22px;overflow:hidden;border:1px solid var(--bd);box-shadow:0 30px 60px -20px #000a;position:relative}
.photo img{display:block;width:100%;filter:saturate(1.3) contrast(1.08) brightness(1.05)}

.float{position:absolute;font-size:2.6rem;transform:translateZ(80px);animation:fl 4s ease-in-out infinite;filter:drop-shadow(0 12px 10px #0008)}
@keyframes fl{50%{translate:0 -14px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.cat{padding:22px;border-radius:20px;color:#fff;cursor:pointer;border:0;text-align:left;font:inherit;position:relative;overflow:hidden;box-shadow:0 18px 30px -14px #000a}
.cat .e{font-size:2.6rem;display:block;transform:translateZ(40px)}.cat b{font-size:1.15rem}.cat small{display:block;opacity:.9}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tab{padding:8px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:inherit}.tab.on{background:linear-gradient(90deg,var(--c1),var(--c4));color:#fff;border-color:transparent}
.item{box-shadow:var(--sh);display:block;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(6px);cursor:pointer;text-align:center;color:var(--tx);font:inherit;width:100%}
.item .e{font-size:3.4rem;display:block;transform:translateZ(60px);filter:drop-shadow(0 14px 8px #0007)}.item h3{margin:10px 0 4px;font-size:1.02rem}.price{font-weight:800;color:var(--c2);font-size:1.15rem}
.about{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}@media(max-width:800px){.about{grid-template-columns:1fr}}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:20px}.feat div{padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--bd)}
.contact{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.contact .box{padding:22px;border-radius:20px;background:var(--card);border:1px solid var(--bd)}
footer{text-align:center;padding:30px;color:var(--mut);border-top:1px solid var(--bd)}
/* item page */
#page{display:none;min-height:100vh}.detail{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;min-height:75vh}@media(max-width:800px){.detail{grid-template-columns:1fr}}
.stage{perspective:900px;display:grid;place-items:center;height:380px}
.plate{width:290px;height:290px;border-radius:50%;display:grid;place-items:center;transform-style:preserve-3d;animation:spin 9s linear infinite;background:radial-gradient(circle at 35% 30%,#fff,#e9e0f5 55%,#9c8bb8);box-shadow:inset 0 0 0 14px #ffffff88,inset 0 0 40px #0004,0 40px 50px -10px #000c,0 0 0 8px var(--ac)}
.plate span{font-size:8.5rem;transform:translateZ(70px);filter:drop-shadow(0 22px 12px #0007)}
@keyframes spin{0%{transform:rotateX(55deg) rotateZ(0)}100%{transform:rotateX(55deg) rotateZ(360deg)}}
.plate span{animation:cnt 9s linear infinite}@keyframes cnt{to{transform:translateZ(70px) rotateZ(-360deg)}}
.stage.flat .plate{animation:none;transform:rotateX(18deg) rotateY(var(--ry,0deg))}.stage.flat .plate span{animation:none}
.back{background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:9px 18px;border-radius:99px;cursor:pointer;font:inherit;margin:18px 0}
.big{font-size:2.6rem;font-weight:800;color:var(--c2)}.spec{padding:18px;border-radius:18px;background:var(--card);border-left:5px solid var(--ac);margin:16px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));background:var(--c1);color:#fff;border-radius:16px;overflow:hidden;margin-top:10px}.info>*{padding:16px 20px;border-right:1px solid #ffffff30;font-weight:600}
.mapbox{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}@media(max-width:800px){.mapbox{grid-template-columns:1fr}}
.map{min-height:300px;border-radius:20px;border:1px solid var(--bd);display:grid;place-items:center;align-content:center;background:linear-gradient(90deg,#0000 49%,#fff9 49% 51%,#0000 51%),linear-gradient(0deg,#0000 49%,#fff9 49% 51%,#0000 51%),linear-gradient(35deg,#0000 47%,#f2c46d 47% 49%,#0000 49%),#dfe9d6;background-size:90px 90px,90px 90px,100% 100%,auto;color:#2b1b17}
.pin{font-size:3rem;animation:fl 2s ease-in-out infinite}.map b{background:#fff;padding:6px 12px;border-radius:99px;margin-top:6px;box-shadow:var(--sh)}.mside{padding:24px;border-radius:20px;background:var(--card);border:1px solid var(--bd)}
</style></head><body>
